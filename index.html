<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff5f8">
<title>にゃんこの7色カラーセラピー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#574751;background:#fff8fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#ffe9f3,#fffafa 60%)}main{max-width:760px;margin:auto;padding:26px 16px 54px}header{text-align:center}h1{font-size:clamp(23px,6vw,34px);margin:10px 0;color:#a04d78}.lead{line-height:1.9;margin:8px auto 24px}.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}@media(min-width:600px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}.cat{appearance:none;border:2px solid #ffe1ed;border-radius:22px;background:white;padding:12px 7px;min-width:0;box-shadow:0 5px 15px #eab8cd33;cursor:pointer;transition:transform .15s,border-color .15s;touch-action:manipulation}.cat:active{transform:scale(.97)}.cat:focus-visible,.again:focus-visible{outline:3px solid #b05a8e;outline-offset:3px}.cat img{display:block;width:100%;height:130px;object-fit:contain}.cat strong{display:block;margin:7px 0 1px;font-size:16px}.cat small{color:#8a7b84;font-size:12px}.cat[aria-pressed="true"]{border-color:#c45c97;background:#fff0f7}.result{display:none;margin:28px 0 0;background:white;border:2px solid #f9d5e5;border-radius:24px;padding:24px 18px;text-align:center;box-shadow:0 8px 25px #eab8cd33}.result.show{display:block}.result h2{color:#a04d78;margin:4px 0 14px}.result p{line-height:1.95;text-align:left;max-width:520px;margin:13px auto}.result .selected{width:140px;height:140px;object-fit:contain}.result .hint{background:#fff4f8;padding:14px;border-radius:15px}.again{border:0;border-radius:999px;background:#bc6b98;color:white;font-weight:700;font-size:16px;padding:14px 26px;margin-top:14px;cursor:pointer;min-height:48px}.notice{text-align:center;font-size:12px;line-height:1.8;color:#867b80;margin-top:25px}.missing{font-size:12px;color:#b03d5e;display:none;margin-top:5px}.missing.visible{display:block}
</style>
</head>
<body>
<main>
<header><div aria-hidden="true">🐱 🌈 💕</div><h1>にゃんこの7色カラーセラピー</h1><p class="lead">今のあなたが気になる猫ちゃんはどの子？<br>直感で1匹選んでみてニャン♪</p></header>
<section class="cats" id="cats" aria-label="7色の猫ちゃんを選ぶ"></section>
<section class="result" id="result" aria-live="polite"><img class="selected" id="selectedImage" alt=""><h2 id="resultTitle"></h2><p id="message"></p><p class="hint" id="hint"></p><button class="again" id="again" type="button">もう一度選ぶニャン 🐾</button></section>
<p class="notice">色のメッセージは自分の気持ちを見つめるためのヒントだニャン。<br>医療・心理診断ではないニャン。入力情報の収集・保存はしないニャン。</p>
</main>
<script>
'use strict';
// 画像は index.html と同じフォルダに置いてください。ファイル名の大文字小文字も一致させてください。
const colors=[
 {id:'red',name:'レッド',word:'情熱・行動',message:'今は何かを始めたい気持ちが芽生えているのかもしれないニャン。小さな一歩でも、自分で決めて進むことを大切にしてニャン。',hint:'今日のヒント：気になっていたことをひとつだけ始めてみるニャン。'},
 {id:'orange',name:'オレンジ',word:'楽しさ・つながり',message:'誰かと笑い合ったり、好きなことに夢中になったりする時間が恋しいのかもしれないニャン。楽しいと感じる心を大事にしてニャン。',hint:'今日のヒント：好きな人や好きなことに少し時間を使ってみるニャン。'},
 {id:'yellow',name:'イエロー',word:'希望・自分らしさ',message:'自分の可能性をもっと信じたい気持ちがあるのかもしれないニャン。人と比べず、あなたらしい輝きを見つけてほしいニャン。',hint:'今日のヒント：自分の好きなところをひとつ書き出してみるニャン。'},
 {id:'green',name:'グリーン',word:'調和・やすらぎ',message:'心がゆったりできる時間を求めているのかもしれないニャン。頑張る日も休む日も、どちらも大切にしていいニャン。',hint:'今日のヒント：植物や自然を眺めながらひと息ついてみるニャン。'},
 {id:'blue',name:'ブルー',word:'落ち着き・伝える',message:'静かな時間の中で、自分の本当の気持ちを確かめたいのかもしれないニャン。言葉にできない気持ちも急がなくていいニャン。',hint:'今日のヒント：今感じていることを一言だけ書いてみるニャン。'},
 {id:'purple',name:'パープル',word:'感性・内面',message:'目に見えることだけでなく、自分の感覚を大切にしたい時なのかもしれないニャン。心が惹かれるものに耳を傾けてみてニャン。',hint:'今日のヒント：好きな音楽や景色にゆっくり触れてみるニャン。'},
 {id:'pink',name:'ピンク',word:'愛情・いたわり',message:'誰かを大切にするように、自分自身にも優しくしたい時なのかもしれないニャン。今日の自分に温かい言葉を贈ってほしいニャン。',hint:'今日のヒント：自分に「今日もありがとう」と伝えてみるニャン。'}
];
const cats=document.getElementById('cats'),result=document.getElementById('result');
for(const c of colors){
 const button=document.createElement('button');button.type='button';button.className='cat';button.setAttribute('aria-pressed','false');
 const img=document.createElement('img');img.src=`cat_${c.id}.png`;img.alt=`${c.name}の猫ちゃん`;img.loading='lazy';
 const label=document.createElement('strong');label.textContent=c.name;
 const sub=document.createElement('small');sub.textContent=c.word;
 const missing=document.createElement('span');missing.className='missing';missing.textContent=`画像が見つからないニャン：cat_${c.id}.png`;
 img.addEventListener('error',()=>{img.style.display='none';missing.classList.add('visible')});
 button.append(img,label,sub,missing);
 button.addEventListener('click',()=>{
  document.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
  const chosen=document.getElementById('selectedImage');chosen.src=img.src;chosen.alt=img.alt;chosen.style.display=img.style.display==='none'?'none':'block';
  document.getElementById('resultTitle').textContent=`${c.name}の猫ちゃんからのメッセージ 🐾`;
  document.getElementById('message').textContent=c.message;
  document.getElementById('hint').textContent=c.hint;
  result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'start'});
 });cats.appendChild(button);
}
document.getElementById('again').addEventListener('click',()=>{result.classList.remove('show');document.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed','false'));window.scrollTo({top:0,behavior:'smooth'});});
</script>
</body>
</html>
