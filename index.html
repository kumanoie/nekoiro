<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#514457;background:#fff7fb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:20px 15px 55px}.hero{text-align:center;padding:24px 10px 15px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#b96c92;font-weight:700}.hero h1{font-size:clamp(23px,6vw,33px);margin:9px 0}.hero p{line-height:1.8;font-size:14px}.panel{background:#fff;border:1px solid #f2dce9;border-radius:22px;padding:20px 15px;box-shadow:0 8px 25px #a35a8410;margin:16px 0}.step{font-weight:700;text-align:center;color:#b65b8c;font-size:15px}.progress{display:flex;gap:7px;margin:15px auto 10px;max-width:350px}.dot{height:8px;border-radius:99px;flex:1;background:#f2e2eb}.dot.on{background:#d983ae}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:20px}@media(min-width:580px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.cat{border:2px solid #f1e2eb;background:#fffafd;border-radius:17px;padding:10px 6px;cursor:pointer;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;color:#59495a;touch-action:manipulation}.cat img{width:100%;max-width:145px;aspect-ratio:1;object-fit:contain}.cat:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #a04f89;outline-offset:3px}.cat:disabled{opacity:.42;cursor:not-allowed}.cat:active{transform:scale(.98)}.picked{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.chip{background:#fff0f8;border-radius:99px;padding:7px 12px;font-size:12px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.primary,.secondary{border:0;border-radius:99px;padding:13px 20px;min-height:48px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:#bf6a9b;color:white}.secondary{background:#f9e8f1;color:#985077}.result-card{background:#fff;border:1px solid #f0d8e5;border-radius:18px;padding:16px;margin:13px 0}.result-head{display:flex;gap:14px;align-items:center}.result-head img{width:100px;height:100px;object-fit:contain;flex:none}.result-head h3{margin:0 0 5px;color:#9e527e}.result-card p{line-height:1.95;margin:9px 0}.reading{padding:14px 4px 2px}.reading h4{font-size:15px;color:#a35480;margin:21px 0 8px;border-left:4px solid #e5a6c8;padding-left:10px}.reading p{font-size:14px;line-height:2.05;margin:8px 0}.reflection{background:#fff6fa;padding:14px;border-radius:14px;margin-top:18px}.reflection strong{color:#9d4e7c}.summary p{line-height:2.05}.summary h4{margin-bottom:6px;color:#985077}.small{font-size:12px;color:#897b89;line-height:1.7}.summary{background:#fff0f8;border-radius:18px;padding:18px;line-height:1.85}.summary h3{margin-top:0;color:#9e527e}.hide{display:none!important}#preview{width:100%;max-width:430px;border-radius:12px;border:1px solid #eed6e3;display:block;margin:12px auto}.notice{text-align:center;color:#886e80;font-size:12px;line-height:1.8}.footer{text-align:center;font-size:12px;color:#998695;margin-top:20px}#status{min-height:1.5em;text-align:center;color:#a04f89;font-size:13px}

<body><main>
<header class="hero"><div class="eyebrow">NYANKO COLOR THERAPY · VER.3</div><h1>🐱 にゃんこの7色<br>カラーセラピー 🌈</h1><p>今、気になる猫ちゃんを直感で3匹選んでニャン💕<br>あなたの気持ちを見つめる小さな時間に。</p></header>
<section id="choose" class="panel"><div class="step" id="step">1匹目を選んでニャン💕</div><div class="progress" aria-label="選択の進み具合"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div></div><div id="picked" class="picked" aria-live="polite"></div><div class="grid" id="grid"></div><div class="actions"><button class="secondary" id="undo" type="button">ひとつ戻るニャン</button><button class="secondary" id="reset1" type="button">最初からニャン</button></div></section>
<section id="results" class="hide" aria-live="polite"><div class="panel"><div class="step">🌈 3匹の猫ちゃんからのメッセージ</div><div id="cards"></div><div class="summary"><h3>💌 3色からの総合メッセージ</h3><div id="combined"></div></div><p class="notice">色の意味は心を見つめるヒントです。性格や心理状態を診断・断定するものではありません。</p><div class="actions"><button id="makeImage" class="primary" type="button">📷 結果画像を作るニャン</button><button id="reset2" class="secondary" type="button">もう一度選ぶニャン</button></div></div></section>
<section id="savePanel" class="panel hide"><div class="step">📷 保存用の画像ができたニャン💕</div><p class="notice">下の画像を長押しして、表示されたメニューから「写真に保存」または「画像を保存」を選んでニャン💕</p><img id="preview" alt="3色カラーセラピーの結果画像"><div id="status" role="status"></div></section>
<footer class="footer">🐾 くまのいえ · 気持ちを大切にするカラーの時間</footer>
</main>
<script>
'use strict';
const colors=[
{id:'red',name:'レッド',file:'cat_red.png',hex:'#e96873',theme:'情熱と行動',feel:'何かを始めたい気持ちや、前に進む力に目を向けているのかもしれないニャン💕',value:'自分の本音を後回しにせず、小さな願いを大切にしてみてニャン💕',action:'今日は「やってみたいこと」をひとつだけ行動に移してみてニャン💕'},
{id:'orange',name:'オレンジ',file:'cat_orange.png',hex:'#ed9a50',theme:'楽しさとつながり',feel:'人とのつながりや、心が弾む時間を求めているのかもしれないニャン💕',value:'頑張るだけでなく、楽しむことにも居場所を作ってあげてニャン💕',action:'思わず笑顔になることを、今日の予定にひとつ加えてみてニャン💕'},
{id:'yellow',name:'イエロー',file:'cat_yellow.png',hex:'#e4b73d',theme:'希望と自分らしさ',feel:'新しい可能性や、自分らしい選択に心が向いているのかもしれないニャン💕',value:'誰かの正解より、自分が納得できる答えを大切にしてニャン💕',action:'今日うれしかったことを、ひとつ言葉にしてみてニャン💕'},
{id:'green',name:'グリーン',file:'cat_green.png',hex:'#79b96c',theme:'安心とバランス',feel:'ほっと落ち着ける時間や、心の余白が気になっているのかもしれないニャン💕',value:'周りへの優しさと同じくらい、自分の心地よさも大切にしてニャン💕',action:'深呼吸をして、心が休まる場所で少し過ごしてみてニャン💕'},
{id:'blue',name:'ブルー',file:'cat_blue.png',hex:'#66aee7',theme:'信頼と穏やかさ',feel:'気持ちを整理したり、静かに自分と向き合いたいのかもしれないニャン💕',value:'急いで答えを出さず、自分のペースを信じてみてニャン💕',action:'伝えたい気持ちを、短い言葉で書き出してみてニャン💕'},
{id:'purple',name:'パープル',file:'cat_purple.png',hex:'#a385d8',theme:'感性と内なる声',feel:'目に見えることだけでなく、自分の感覚を大切にしたいのかもしれないニャン💕',value:'まだ言葉にならない気持ちにも、そっと耳を傾けてみてニャン💕',action:'好きな音楽や香りで、静かな時間を作ってみてニャン💕'},

// くまのいえオリジナルのセルフリフレクション文章。診断ではありません。
const insights={
red:{symbol:'生命力・決断・情熱・自分の意志',deep:'赤は、心の中にある「動きたい」「守りたい」「伝えたい」という熱を思い出させてくれる色だニャン💕 何かを変えたいと感じる日も、ただ今日を精いっぱい生きたい日も、その熱の形は人それぞれだニャン💕',balance:'勢いがあるときほど、休むことまで後回しにしなくていいニャン💕 すぐに結果が出なくても、心が向いたことに気づけた時点で大切な一歩だニャン💕',relation:'誰かに合わせて自分の気持ちを飲み込んでいないか、やさしく確かめてみてニャン💕 意見が違っても、自分の願いを穏やかに伝える道はあるニャン💕',question:'今、誰の期待でもなく、わたし自身が望んでいることは何だろうニャン？',ritual:'好きな赤い小物を目に入れて、今日ひとつだけ「わたしはこうしたい」と言葉にしてみてニャン💕'},
orange:{symbol:'喜び・交流・好奇心・ぬくもり',deep:'オレンジは、人と笑い合う楽しさや、心がほぐれる瞬間を思い出させてくれる色だニャン💕 楽しさは特別な予定の中だけでなく、好きな飲み物や短いおしゃべりの中にも見つけられるニャン💕',balance:'いつも明るく振る舞う必要はないニャン💕 ひとりで過ごしたい日があっても、あなたのあたたかさが消えるわけではないニャン💕',relation:'相手を楽しませようと頑張りすぎず、一緒にいて自然体でいられる時間を大切にしてみてニャン💕 笑顔を分け合うことと、無理に笑うことは別だニャン💕',question:'最近、理由もなく笑顔になれた瞬間はいつだったかニャン？',ritual:'お気に入りのおやつや音楽をひとつ選んで、楽しむ時間を予定に入れてみてニャン💕'},
yellow:{symbol:'希望・知性・選択・自分らしさ',deep:'黄色は、好奇心や発見、そして「自分で選ぶ」という感覚を照らしてくれる色だニャン💕 正解探しに疲れたときこそ、どんな選択なら自分の心が軽くなるかを見つめてみてニャン💕',balance:'考える力は大切だけれど、何でも完璧に理解してから進まなくてもいいニャン💕 迷っている自分を責めず、まだ知らない可能性を楽しんでみてニャン💕',relation:'誰かの意見を聞くことと、その意見に従うことは同じではないニャン💕 相手を尊重しながら自分の考えも大切にしていいニャン💕',question:'人の評価を気にしなかったら、今日は何を選びたいかニャン？',ritual:'今日の小さな発見をひとつメモして、自分の好奇心に拍手してみてニャン💕'},
green:{symbol:'調和・安心・成長・余白',deep:'緑は、呼吸を整えるような穏やかさや、少しずつ育つものの尊さを思い出させてくれる色だニャン💕 変化が見えない時間にも、心の中でゆっくり育っているものがあるかもしれないニャン💕',balance:'周囲の平和を守るために、自分だけが我慢し続けなくていいニャン💕 心地よい距離を選ぶことも、大切なやさしさのひとつだニャン💕',relation:'大切な人と過ごす時間も、自分ひとりで落ち着く時間も、どちらも必要に応じて選んでいいニャン💕 無理なく続く関係を育てていこうニャン💕',question:'わたしが心からほっとできる場所や時間はどこだろうニャン？',ritual:'窓の外の木々や小さな植物を眺めながら、ゆっくり深呼吸してみてニャン💕'},
blue:{symbol:'信頼・対話・誠実・静けさ',deep:'青は、落ち着いて考える時間や、自分の気持ちを丁寧に言葉にすることを思い出させてくれる色だニャン💕 答えを急がず、まずは自分の心の声を聞く時間を持ってみてニャン💕',balance:'我慢して黙っていることと、心から穏やかでいることは違うニャン💕 伝えたいことがあるなら、短い言葉から始めてもいいニャン💕',relation:'相手の話を聞くのと同じくらい、自分の話にも耳を傾けてあげてニャン💕 正直な気持ちは、落ち着いた伝え方で届けられるニャン💕',question:'まだ誰にも伝えていない大切な気持ちはあるかニャン？',ritual:'ノートに「本当はね」と書いて、その続きに浮かぶ言葉を自由に並べてみてニャン💕'},
purple:{symbol:'感性・想像力・内省・変化',deep:'紫は、目に見えない気持ちや、言葉になる前の感覚を大切にする時間を思い出させてくれる色だニャン💕 はっきり説明できない「好き」や「気になる」にも、あなたらしさのヒントがあるニャン💕',balance:'直感を大切にしながら、現実の状況や確かな情報も一緒に見ていこうニャン💕 感じることと確かめることは、どちらもあなたを支えるニャン💕',relation:'気持ちをすべて理解してもらおうと焦らなくていいニャン💕 言葉にできるところから少しずつ共有してみてニャン💕',question:'理由を説明できなくても、今わたしが惹かれるものは何だろうニャン？',ritual:'好きな音楽や絵に触れて、浮かんだイメージを自由に書き留めてみてニャン💕'},
pink:{symbol:'愛情・受容・思いやり・自己慈愛',deep:'ピンクは、大切な誰かに向けるやさしさを、自分自身にも向けることを思い出させてくれる色だニャン💕 頑張れた日も、うまくいかなかった日も、あなたはいたわられていい存在だニャン💕',balance:'相手を大切に思うからこそ、何でも引き受ける必要はないニャン💕 自分の気持ちや体力を守ることも、愛情を長く育てるための大切な選択だニャン💕',relation:'言葉や行動で愛情を伝える方法は、ひとつではないニャン💕 自分にも相手にも心地よい距離感を探してみてニャン💕',question:'親しい人にかけるようなやさしい言葉を、自分にもかけるなら何と言うかニャン？',ritual:'温かい飲み物を用意して、自分に「今日もありがとう」と伝えてみてニャン💕'}
};
const roles=['今の気持ち','大切にしたいこと','これからの一歩'];
const selection=[];const el=id=>document.getElementById(id);
function draw(){const count=selection.length;el('step').textContent=count===0?'1匹目を選んでニャン💕':count===1?'2匹目を選んでニャン💕':'3匹目を選んでニャン💕';for(let i=0;i<3;i++)el('d'+i).classList.toggle('on',i<count);el('picked').replaceChildren();selection.forEach((c,i)=>{const s=document.createElement('span');s.className='chip';s.textContent=`${i+1}匹目：${c.name}`;el('picked').append(s)});el('grid').replaceChildren();colors.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='cat';b.disabled=selection.some(s=>s.id===c.id);const img=document.createElement('img');img.src=c.file;img.alt=c.name+'の猫ちゃん';img.loading='lazy';const span=document.createElement('span');span.textContent=c.name;b.append(img,span);b.addEventListener('click',()=>{selection.push(c);if(selection.length===3)showResults();else draw()});el('grid').append(b)});el('undo').disabled=count===0;el('choose').classList.remove('hide');el('results').classList.add('hide');el('savePanel').classList.add('hide')}
function para(parent,text){const p=document.createElement('p');p.textContent=text;parent.append(p)}
function heading(parent,text){const h=document.createElement('h4');h.textContent=text;parent.append(h)}
function showResults(){el('choose').classList.add('hide');el('results').classList.remove('hide');el('savePanel').classList.add('hide');el('cards').replaceChildren();selection.forEach((c,i)=>{const info=insights[c.id];const section=document.createElement('article');section.className='result-card';const head=document.createElement('div');head.className='result-head';const img=document.createElement('img');img.src=c.file;img.alt=c.name+'の猫ちゃん';const title=document.createElement('div');const h=document.createElement('h3');h.textContent=`${i+1}色目｜${roles[i]}`;const sub=document.createElement('div');sub.textContent=`${c.name} · ${c.theme}`;title.append(h,sub);head.append(img,title);section.append(head);const reading=document.createElement('div');reading.className='reading';heading(reading,'🌈 この色が象徴するもの');para(reading,info.symbol+'を象徴する色だニャン💕');para(reading,info.deep);heading(reading,i===0?'💗 今の心へのメッセージ':i===1?'🌷 大切にしたい心の軸':'🐾 これからの一歩');para(reading,[c.feel,c.value,c.action][i]);heading(reading,'☁️ 頑張りすぎないためのヒント');para(reading,info.balance);heading(reading,'🤝 人との関わりで意識したいこと');para(reading,info.relation);heading(reading,'✨ 今日の小さなカラーアクション');para(reading,info.ritual);const reflection=document.createElement('div');reflection.className='reflection';const strong=document.createElement('strong');strong.textContent='💌 自分に問いかけてみるニャン💕';reflection.append(strong);para(reflection,info.question);reading.append(reflection);section.append(reading);el('cards').append(section)});const area=el('combined');area.replaceChildren();heading(area,'🌸 まずは今の気持ちを受け止めるニャン💕');para(area,`${selection[0].name}を最初に選んだのは、今のあなたが「${selection[0].theme}」というテーマに目を向けるきっかけかもしれないニャン💕 正しい答えを探すより、読んで心に残った言葉を大切にしてニャン💕`);heading(area,'🌷 大切にしたいことを見つけるニャン💕');para(area,`${selection[1].name}の「${selection[1].theme}」は、これからの日々に取り入れたい視点として眺めてみてニャン💕 すべてを変えなくても、心地よい選択をひとつ増やすだけで十分だニャン💕`);heading(area,'🐾 明日へつながる一歩を選ぶニャン💕');para(area,`${selection[2].name}の「${selection[2].theme}」をヒントに、無理のない小さな行動を考えてみてニャン💕 できなかった日があっても、また選び直せるから大丈夫だニャン💕`);heading(area,'💞 3色を選んだあなたへ');para(area,`今日の3色は、${selection.map(c=>c.name).join('・')}だニャン💕 色は未来を決めるものでも、心を決めつけるものでもないニャン💕 そのときどきの自分に問いかけるための、小さな入り口として楽しんでニャン💕`);el('results').scrollIntoView({behavior:'smooth',block:'start'})}
function reset(){selection.length=0;draw();window.scrollTo({top:0,behavior:'smooth'})}el('undo').onclick=()=>{selection.pop();draw()};el('reset1').onclick=reset;el('reset2').onclick=reset;
// All image generation happens locally in the browser; no network API or data storage.
const loadImage=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('画像を読み込めません: '+src));im.src=src});
function wrap(ctx,str,x,y,maxWidth,lineHeight){let line='';for(const ch of [...str]){if(ctx.measureText(line+ch).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;line=''}line+=ch}if(line){ctx.fillText(line,x,y);y+=lineHeight}return y}
async function createImage(){const btn=el('makeImage');btn.disabled=true;btn.textContent='画像を作成中…';el('status').textContent='';try{const imgs=await Promise.all(selection.map(c=>loadImage(c.file)));const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1450;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('画像の作成に対応していません');ctx.fillStyle='#fff7fb';ctx.fillRect(0,0,900,1450);ctx.textAlign='center';ctx.fillStyle='#a45781';ctx.font='bold 25px sans-serif';ctx.fillText('NYANKO COLOR THERAPY',450,66);ctx.fillStyle='#514457';ctx.font='bold 44px sans-serif';ctx.fillText('にゃんこの7色カラーセラピー',450,133);ctx.font='24px sans-serif';ctx.fillText('わたしが選んだ3色のメッセージ',450,178);ctx.textAlign='left';selection.forEach((c,i)=>{const top=220+i*320;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.roundRect(42,top,816,297,24);ctx.fill();ctx.fillStyle=c.hex;ctx.fillRect(42,top+15,9,268);const img=imgs[i];const ratio=Math.min(205/img.width,205/img.height);const w=img.width*ratio,h=img.height*ratio;ctx.drawImage(img,75+(205-w)/2,top+40+(205-h)/2,w,h);ctx.fillStyle='#875377';ctx.font='bold 28px sans-serif';ctx.fillText(`${i+1}色目｜${roles[i]}`,315,top+55);ctx.fillStyle='#514457';ctx.font='bold 26px sans-serif';ctx.fillText(`${c.name} · ${c.theme}`,315,top+102);ctx.font='23px sans-serif';wrap(ctx,[c.feel,c.value,c.action][i],315,top+148,510,37)});ctx.fillStyle='#fae8f2';ctx.beginPath();ctx.roundRect(42,1200,816,176,22);ctx.fill();ctx.fillStyle='#875377';ctx.font='bold 28px sans-serif';ctx.fillText('3色からのメッセージ',72,1245);ctx.fillStyle='#514457';ctx.font='22px sans-serif';wrap(ctx,`${selection[0].name}の気持ちを受け止め、${selection[1].name}の「${selection[1].theme}」を大切に。${selection[2].name}の「${selection[2].theme}」をヒントに一歩ずつ進んでニャン💕`,72,1290,752,34);ctx.textAlign='center';ctx.font='20px sans-serif';ctx.fillStyle='#9a8191';ctx.fillText('色は自分の気持ちを見つめるためのヒントです',450,1422);const data=canvas.toDataURL('image/png');el('preview').src=data;el('savePanel').classList.remove('hide');el('savePanel').scrollIntoView({behavior:'smooth',block:'start'});}catch(err){el('savePanel').classList.remove('hide');el('preview').removeAttribute('src');el('preview').classList.add('hide');el('status').textContent='画像を作れなかったニャン。GitHubの画像ファイル名を確認してね。 '+err.message;el('savePanel').scrollIntoView({behavior:'smooth'})}finally{btn.disabled=false;btn.textContent='📷 結果画像を作るニャン'}}
el('makeImage').onclick=()=>{el('preview').classList.remove('hide');createImage()};draw();
</script></body></html>
