<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7fb">
<title>にゃんこの7色カラーセラピー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#514457;background:#fff7fb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:20px 15px 55px}.hero{text-align:center;padding:24px 10px 15px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#b96c92;font-weight:700}.hero h1{font-size:clamp(23px,6vw,33px);margin:9px 0}.hero p{line-height:1.8;font-size:14px}.panel{background:#fff;border:1px solid #f2dce9;border-radius:22px;padding:20px 15px;box-shadow:0 8px 25px #a35a8410;margin:16px 0}.step{font-weight:700;text-align:center;color:#b65b8c;font-size:15px}.progress{display:flex;gap:7px;margin:15px auto 10px;max-width:350px}.dot{height:8px;border-radius:99px;flex:1;background:#f2e2eb}.dot.on{background:#d983ae}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:20px}@media(min-width:580px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.cat{border:2px solid #f1e2eb;background:#fffafd;border-radius:17px;padding:10px 6px;cursor:pointer;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;color:#59495a;touch-action:manipulation}.cat img{width:100%;max-width:145px;aspect-ratio:1;object-fit:contain}.cat:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #a04f89;outline-offset:3px}.cat:disabled{opacity:.42;cursor:not-allowed}.cat:active{transform:scale(.98)}.picked{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.chip{background:#fff0f8;border-radius:99px;padding:7px 12px;font-size:12px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.primary,.secondary{border:0;border-radius:99px;padding:13px 20px;min-height:48px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:#bf6a9b;color:white}.secondary{background:#f9e8f1;color:#985077}.result-card{background:#fff;border:1px solid #f0d8e5;border-radius:18px;padding:16px;margin:13px 0}.result-head{display:flex;gap:14px;align-items:center}.result-head img{width:100px;height:100px;object-fit:contain;flex:none}.result-head h3{margin:0 0 5px;color:#9e527e}.result-card p{line-height:1.85;margin:9px 0}.small{font-size:12px;color:#897b89;line-height:1.7}.summary{background:#fff0f8;border-radius:18px;padding:18px;line-height:1.85}.summary h3{margin-top:0;color:#9e527e}.hide{display:none!important}#preview{width:100%;max-width:430px;border-radius:12px;border:1px solid #eed6e3;display:block;margin:12px auto}.notice{text-align:center;color:#886e80;font-size:12px;line-height:1.8}.footer{text-align:center;font-size:12px;color:#998695;margin-top:20px}#status{min-height:1.5em;text-align:center;color:#a04f89;font-size:13px}
</style>
</head>
<body><main>
<header class="hero"><div class="eyebrow">NYANKO COLOR THERAPY · VER.2</div><h1>🐱 にゃんこの7色<br>カラーセラピー 🌈</h1><p>今、気になる猫ちゃんを直感で3匹選んでニャン💕<br>あなたの気持ちを見つめる小さな時間に。</p></header>
<section id="choose" class="panel"><div class="step" id="step">1匹目を選んでニャン💕</div><div class="progress" aria-label="選択の進み具合"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div></div><div id="picked" class="picked" aria-live="polite"></div><div class="grid" id="grid"></div><div class="actions"><button class="secondary" id="undo" type="button">ひとつ戻る</button><button class="secondary" id="reset1" type="button">最初から</button></div></section>
<section id="results" class="hide" aria-live="polite"><div class="panel"><div class="step">🌈 3匹の猫ちゃんからのメッセージ</div><div id="cards"></div><div class="summary"><h3>💌 3色からのメッセージ</h3><p id="combined"></p></div><p class="notice">色の意味は心を見つめるヒントです。性格や心理状態を診断・断定するものではありません。</p><div class="actions"><button id="makeImage" class="primary" type="button">📷 結果画像を作る</button><button id="reset2" class="secondary" type="button">もう一度選ぶ</button></div></div></section>
<section id="savePanel" class="panel hide"><div class="step">📷 保存用の画像ができたニャン💕</div><p class="notice">iPhoneは画像を長押しして「写真に保存」または「画像を保存」を選んでね。保存できない場合は下のボタンも試してね。</p><img id="preview" alt="3色カラーセラピーの結果画像"><div class="actions"><a id="download" class="primary" download="nyanko-color-result.png" style="text-decoration:none" href="#">画像を保存する</a></div><div id="status" role="status"></div></section>
<footer class="footer">🐾 くまのいえ · 気持ちを大切にするカラーの時間</footer>
</main>
<script>
'use strict';
const colors=[
{id:'red',name:'レッド',file:'cat_red.png',hex:'#e96873',theme:'情熱と行動',feel:'何かを始めたい気持ちや、前に進む力に目を向けているのかもしれないニャン💕',value:'自分の本音を後回しにせず、小さな願いを大切にしてみてニャン💕',action:'今日は「やってみたいこと」をひとつだけ行動に移してみてニャン💕'},
{id:'orange',name:'オレンジ',file:'cat_orange.png',hex:'#ed9a50',theme:'楽しさとつながり',feel:'人とのつながりや、心が弾む時間を求めているのかもしれないニャン💕',value:'頑張るだけでなく、楽しむことにも居場所を作ってあげてニャン💕',action:'思わず笑顔になることを、今日の予定にひとつ加えてみてニャン💕'},
{id:'yellow',name:'イエロー',file:'cat_yellow.png',hex:'#e4b73d',theme:'希望と自分らしさ',feel:'新しい可能性や、自分らしい選択に心が向いているのかもしれないニャン💕',value:'誰かの正解より、自分が納得できる答えを大切にしてニャン💕',action:'今日うれしかったことを、ひとつ言葉にしてみてニャン💕'},
{id:'green',name:'グリーン',file:'cat_green.png',hex:'#79b96c',theme:'安心とバランス',feel:'ほっと落ち着ける時間や、心の余白が気になっているのかもしれないニャン💕',value:'周りへの優しさと同じくらい、自分の心地よさも大切にしてニャン💕',action:'深呼吸をして、心が休まる場所で少し過ごしてみてニャン💕'},
{id:'blue',name:'ブルー',file:'cat_blue.png',hex:'#66aee7',theme:'信頼と穏やかさ',feel:'気持ちを整理したり、静かに自分と向き合いたいのかもしれないニャン💕',value:'急いで答えを出さず、自分のペースを信じてみてニャン💕',action:'伝えたい気持ちを、短い言葉で書き出してみてニャン💕'},
{id:'purple',name:'パープル',file:'cat_purple.png',hex:'#a385d8',theme:'感性と内なる声',feel:'目に見えることだけでなく、自分の感覚を大切にしたいのかもしれないニャン💕',value:'まだ言葉にならない気持ちにも、そっと耳を傾けてみてニャン💕',action:'好きな音楽や香りで、静かな時間を作ってみてニャン💕'},
{id:'pink',name:'ピンク',file:'cat_pink.png',hex:'#e88bb9',theme:'愛情といたわり',feel:'優しさやぬくもりを、いつもより大切に感じているのかもしれないニャン💕',value:'誰かを思うように、自分自身にも優しくしてあげてニャン💕',action:'自分に「今日もありがとう」と伝えてみてニャン💕'}
];
const roles=['今の気持ち','大切にしたいこと','これからの一歩'];
const selection=[];const el=id=>document.getElementById(id);
function draw(){const count=selection.length;el('step').textContent=count===0?'1匹目を選んでニャン💕':count===1?'2匹目を選んでニャン💕':'3匹目を選んでニャン💕';for(let i=0;i<3;i++)el('d'+i).classList.toggle('on',i<count);el('picked').replaceChildren();selection.forEach((c,i)=>{const s=document.createElement('span');s.className='chip';s.textContent=`${i+1}匹目：${c.name}`;el('picked').append(s)});el('grid').replaceChildren();colors.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='cat';b.disabled=selection.some(s=>s.id===c.id);const img=document.createElement('img');img.src=c.file;img.alt=c.name+'の猫ちゃん';img.loading='lazy';const span=document.createElement('span');span.textContent=c.name;b.append(img,span);b.addEventListener('click',()=>{selection.push(c);if(selection.length===3)showResults();else draw()});el('grid').append(b)});el('undo').disabled=count===0;el('choose').classList.remove('hide');el('results').classList.add('hide');el('savePanel').classList.add('hide')}
function showResults(){el('choose').classList.add('hide');el('results').classList.remove('hide');el('savePanel').classList.add('hide');el('cards').replaceChildren();selection.forEach((c,i)=>{const section=document.createElement('article');section.className='result-card';const head=document.createElement('div');head.className='result-head';const img=document.createElement('img');img.src=c.file;img.alt=c.name+'の猫ちゃん';const title=document.createElement('div');const h=document.createElement('h3');h.textContent=`${i+1}色目｜${roles[i]}`;const sub=document.createElement('div');sub.textContent=`${c.name} · ${c.theme}`;title.append(h,sub);head.append(img,title);const p=document.createElement('p');p.textContent=[c.feel,c.value,c.action][i];section.append(head,p);el('cards').append(section)});el('combined').textContent=`${selection[0].name}が教えてくれる今の気持ちを受け止めて、${selection[1].name}が伝える「${selection[1].theme}」を大切に。これからは${selection[2].name}の「${selection[2].theme}」をヒントに、あなたらしい一歩を選んでみてニャン💕`;el('results').scrollIntoView({behavior:'smooth',block:'start'})}
function reset(){selection.length=0;draw();window.scrollTo({top:0,behavior:'smooth'})}el('undo').onclick=()=>{selection.pop();draw()};el('reset1').onclick=reset;el('reset2').onclick=reset;
// All image generation happens locally in the browser; no network API or data storage.
const loadImage=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('画像を読み込めません: '+src));im.src=src});
function wrap(ctx,str,x,y,maxWidth,lineHeight){let line='';for(const ch of [...str]){if(ctx.measureText(line+ch).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;line=''}line+=ch}if(line){ctx.fillText(line,x,y);y+=lineHeight}return y}
async function createImage(){const btn=el('makeImage');btn.disabled=true;btn.textContent='画像を作成中…';el('status').textContent='';try{const imgs=await Promise.all(selection.map(c=>loadImage(c.file)));const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1450;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('画像の作成に対応していません');ctx.fillStyle='#fff7fb';ctx.fillRect(0,0,900,1450);ctx.textAlign='center';ctx.fillStyle='#a45781';ctx.font='bold 25px sans-serif';ctx.fillText('NYANKO COLOR THERAPY',450,66);ctx.fillStyle='#514457';ctx.font='bold 44px sans-serif';ctx.fillText('にゃんこの7色カラーセラピー',450,133);ctx.font='24px sans-serif';ctx.fillText('わたしが選んだ3色のメッセージ',450,178);ctx.textAlign='left';selection.forEach((c,i)=>{const top=220+i*320;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.roundRect(42,top,816,297,24);ctx.fill();ctx.fillStyle=c.hex;ctx.fillRect(42,top+15,9,268);const img=imgs[i];const ratio=Math.min(205/img.width,205/img.height);const w=img.width*ratio,h=img.height*ratio;ctx.drawImage(img,75+(205-w)/2,top+40+(205-h)/2,w,h);ctx.fillStyle='#875377';ctx.font='bold 28px sans-serif';ctx.fillText(`${i+1}色目｜${roles[i]}`,315,top+55);ctx.fillStyle='#514457';ctx.font='bold 26px sans-serif';ctx.fillText(`${c.name} · ${c.theme}`,315,top+102);ctx.font='23px sans-serif';wrap(ctx,[c.feel,c.value,c.action][i],315,top+148,510,37)});ctx.fillStyle='#fae8f2';ctx.beginPath();ctx.roundRect(42,1200,816,176,22);ctx.fill();ctx.fillStyle='#875377';ctx.font='bold 28px sans-serif';ctx.fillText('3色からのメッセージ',72,1245);ctx.fillStyle='#514457';ctx.font='22px sans-serif';wrap(ctx,`${selection[0].name}の気持ちを受け止め、${selection[1].name}の「${selection[1].theme}」を大切に。${selection[2].name}の「${selection[2].theme}」をヒントに一歩ずつ進んでニャン💕`,72,1290,752,34);ctx.textAlign='center';ctx.font='20px sans-serif';ctx.fillStyle='#9a8191';ctx.fillText('色は自分の気持ちを見つめるためのヒントです',450,1422);const data=canvas.toDataURL('image/png');el('preview').src=data;el('download').href=data;el('savePanel').classList.remove('hide');el('savePanel').scrollIntoView({behavior:'smooth',block:'start'});}catch(err){el('savePanel').classList.remove('hide');el('preview').removeAttribute('src');el('preview').classList.add('hide');el('download').classList.add('hide');el('status').textContent='画像を作れなかったニャン。GitHubの画像ファイル名を確認してね。 '+err.message;el('savePanel').scrollIntoView({behavior:'smooth'})}finally{btn.disabled=false;btn.textContent='📷 結果画像を作る'}}
el('makeImage').onclick=()=>{el('preview').classList.remove('hide');el('download').classList.remove('hide');createImage()};draw();
</script></body></html>
